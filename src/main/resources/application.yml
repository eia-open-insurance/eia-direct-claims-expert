server:
  port: 8087

spring:
  application:
    name: eia-direct-claims-expert
  datasource:
    url: jdbc:postgresql://localhost:5432/eia_direct
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

